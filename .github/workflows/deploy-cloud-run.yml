name: Déployer le serveur sur Cloud Run

# Se déclenche à chaque push sur main qui touche le code du serveur (pas le
# client, qui a son propre workflow Firebase Hosting) · évite un redéploiement
# du serveur pour un simple changement d'écran côté client.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-cloud-run.yml'

permissions:
  contents: read

env:
  PROJECT_ID: omega-x-ec07a
  REGION: us-east1
  SERVICE: comptaflow-api

jobs:
  # PORTILLON · rien ne part en production sans que tout soit vert. L'ordre
  # comptait : le job de déploiement applique `prisma migrate deploy` AVANT
  # de déployer, donc un push cassé migrait la base de production, puis
  # déployait le code cassé par-dessus. Une migration appliquée ne se
  # reprend pas d'un `git revert`.
  #
  # Ce job ne touche NI la base NI Cloud Run · il n'a aucun secret, aucune
  # authentification Google. Il compile, teste et construit les deux côtés.
  verifier:
    runs-on: ubuntu-latest

    # UNE VRAIE BASE, JETABLE · le 2026-09-02, sept déploiements de suite ont
    # été refusés par Cloud Run parce que le serveur mourait au démarrage, et
    # rien dans la chaîne ne l'avait vu : tous les tests tournaient sur des
    # Prisma factices, qui rendent des promesses déjà lancées et ne
    # désérialisent aucune colonne. Compiler et tester ne prouve pas que le
    # serveur démarre. Cette base-là le prouve.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: omega
          POSTGRES_PASSWORD: omega
          POSTGRES_DB: omegatest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` déclenche le postinstall `prisma generate` · le client
      # Prisma doit exister avant que tsc ne lise le code qui l'importe.
      - name: Installer et engendrer le client Prisma (serveur)
        run: npm ci

      - name: Typage du serveur
        run: npx tsc --noEmit

      - name: Tests du serveur
        run: npx jest --ci

      - name: Construction du serveur
        run: npm run build

      # PREUVE DE DÉMARRAGE · migrations appliquées sur une base vierge, puis
      # le serveur lancé pour de bon et interrogé sur /health. Les valeurs
      # ci-dessous sont des valeurs de contrôle, jetables avec la base · ce
      # job n'a toujours aucun secret.
      - name: "Démarrage réel du serveur contre une vraie base"
        env:
          DATABASE_URL: postgresql://omega:omega@127.0.0.1:5432/omegatest
          JWT_SECRET: controle-de-demarrage-jetable-0123456789abcdef
          JWT_EXPIRES_IN: 8h
          PORT: '8080'
          CORS_ORIGIN: https://exemple.invalid
          # Non vide EXPRÈS · c'est cette promotion au démarrage qui traverse
          # la sortie de cloisonnement et l'extension d'audit, donc le chemin
          # exact qui tombait en production.
          OPERATEURS_PLATEFORME: controle@exemple.invalid
        run: |
          npx prisma migrate deploy
          point=dist/main.js
          [ -f "$point" ] || point=dist/src/main.js
          echo "point d'entrée · $point"
          node "$point" > /tmp/demarrage.log 2>&1 &
          pid=$!
          vivant=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/health > /dev/null; then vivant=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 2
          done
          kill "$pid" 2>/dev/null || true
          if [ "$vivant" != "1" ]; then
            echo "::error::Le serveur n'a pas démarré · Cloud Run le refuserait de la même façon"
            tail -60 /tmp/demarrage.log
            exit 1
          fi
          # UN MAILLON NON ÉCRIT NE FAIT PAS TOMBER LA REQUÊTE (choix assumé
          # dans extension-audit.ts) · il ne se voit donc que là. Sans cette
          # ligne, le journal d'audit pourrait redevenir muet sans que rien
          # ne rougisse.
          if grep -q "Maillon d'audit NON écrit" /tmp/demarrage.log; then
            echo "::error::Le journal d'audit n'écrit plus · la chaîne est muette"
            grep -A4 "Maillon d'audit NON écrit" /tmp/demarrage.log | head -20
            exit 1
          fi
          echo "serveur vivant, base jointe, journal d'audit écrit"

      - name: Installer le client
        working-directory: client
        run: npm ci

      - name: Typage du client
        working-directory: client
        run: npx tsc --noEmit

      - name: Tests du client
        working-directory: client
        run: npx vitest run

      - name: Construction du client
        working-directory: client
        run: npm run build

  migrer-et-deployer:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # La base se met à jour AVANT le serveur : une migration en attente ne
      # doit jamais arriver après du code qui en dépend déjà.
      # ENDPOINT DIRECT, et jamais le poolé · `migrate deploy` pose un verrou
      # consultatif de session et exécute du DDL, deux choses qu'un pooling en
      # mode transaction ne sait pas tenir. C'est la même raison qui fait
      # passer pg_dump par la chaîne directe (workflow de sauvegarde).
      - name: Appliquer les migrations Prisma
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # PLAFOND D'INSTANCES · `--max-instances 4` avec `--concurrency 80`
      # (la valeur par défaut de Cloud Run, posée ICI pour qu'elle cesse
      # d'être implicite) : quatre instances au plus, chacune servant jusqu'à
      # quatre-vingts requêtes en parallèle, soit trois cent vingt requêtes
      # simultanées · très au-delà de ce qu'un cabinet et ses dossiers
      # produisent. Ce qui est borné ici, ce n'est pas le trafic, ce sont les
      # CONNEXIONS : sans plafond, Cloud Run peut monter à cent instances,
      # chacune ouvrant son pool Prisma, et la base tombe pour tout le monde.
      # La mémoire n'est PAS touchée : les plafonds de fenêtre du logiciel ont
      # été mesurés sur un tas de 460 Mio (docs/capacite-mesuree.md), et la
      # changer sans re-mesurer laisserait ce document mentir.
      #
      # DÉMARRAGE À FROID · `--min-instances 1` garde une instance chaude.
      # Sans elle, Cloud Run éteint le service après quelques minutes
      # d'inactivité, et la requête suivante attend le démarrage complet de
      # NestJS ET l'ouverture d'une connexion Prisma vers Neon · plusieurs
      # secondes, sur la PREMIÈRE page ouverte, celle qui donne l'impression
      # que tout le logiciel est lent. `--cpu-boost` accélère en plus la
      # phase de démarrage elle-même. Le coût est celui d'une instance
      # toujours allumée ; c'est le prix d'un logiciel qui répond.
      #
      # Les variables passent par un FICHIER (--env-vars-file) et non par
      # --set-env-vars : gcloud découpe ce dernier sur les virgules et les
      # égalités, et une chaîne de connexion Postgres (mot de passe,
      # ?sslmode=...&...) l'a fait échouer en erreur d'usage (exit 2). Le
      # fichier est produit en JSON (JSON est du YAML valide) depuis
      # l'environnement, jamais par interpolation shell · aucun caractère du
      # secret ne peut casser ni la commande ni le fichier.
      - name: Déployer sur Cloud Run
        env:
          # DEUX CHAÎNES, DEUX USAGES · voir docs/connexions-et-plafonds.md.
          #
          # `API_DATABASE_URL` est l'endpoint DIRECT : il sert aux migrations
          # (étape précédente) et à pg_dump (workflow de sauvegarde), qui
          # tiennent tous deux une session longue et des verrous, ce qu'un
          # pooling en mode transaction ne permet pas.
          #
          # `API_DATABASE_URL_POOLED` est l'endpoint POOLÉ, et c'est LUI que
          # le service doit recevoir : Cloud Run multiplie les instances sous
          # la charge, chacune ouvre son propre pool Prisma, et sans
          # multiplexage quelques dossiers actifs en même temps épuisent les
          # connexions de la base pour TOUS les cabinets à la fois.
          #
          # REPLI VOULU · tant que le second secret n'existe pas, le premier
          # sert, et le déploiement se comporte exactement comme avant. Un
          # workflow qui exigerait un secret absent couperait le service au
          # push suivant, pour un progrès qui n'est pas encore possible.
          DATABASE_URL: ${{ secrets.API_DATABASE_URL_POOLED || secrets.API_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.API_JWT_SECRET }}
          JWT_EXPIRES_IN: ${{ secrets.API_JWT_EXPIRES_IN }}
          CORS_ORIGIN: https://oomega.web.app,https://oomega.firebaseapp.com
          # Adresses e-mail des opérateurs de la plateforme (console
          # « Administration VMG Consulting »), séparées par des virgules.
          # Doit passer par ICI et non par la console Cloud Run :
          # --env-vars-file REMPLACE toutes les variables du service à chaque
          # déploiement, une variable posée à la main serait effacée au push
          # suivant. Le secret, s'il existe, PREND LE PAS sur la valeur par
          # défaut · c'est par lui qu'on ajoutera les associés du cabinet
          # sans toucher au code. L'adresse du cabinet n'est pas un secret :
          # c'est celle que le message de refus d'inscription donne à tout
          # visiteur.
          OPERATEURS_PLATEFORME: ${{ secrets.API_OPERATEURS_PLATEFORME || 'admin@vmgconsulting.cd' }}
          # L'auto-inscription est FERMÉE : aucune variable INSCRIPTION_PUBLIQUE
          # n'est posée, et /auth/register refuse. Elle a été ouverte le temps
          # de créer le compte du cabinet (1er septembre 2026), puis retirée
          # · ce retrait a redéployé le service, et ce redémarrage a promu le
          # compte créé (le bootstrap des opérateurs ne court qu'au démarrage).
          # Pour rouvrir un jour un canal libre-service, poser ici
          # `INSCRIPTION_PUBLIQUE: 'true'` et l'ajouter aux variables ci-dessous.
        run: |
          python3 - <<'PY' > /tmp/env-vars.yaml
          import json, os, sys
          from urllib.parse import urlsplit, urlunsplit, parse_qsl, urlencode

          cles = ("DATABASE_URL", "JWT_SECRET", "JWT_EXPIRES_IN", "CORS_ORIGIN")
          variables = {c: os.environ[c] for c in cles}

          def regler_le_pooling(chaine):
              """Pose les deux paramètres qu'un endpoint poolé exige, sans jamais
              rendre la chaîne lisible.

              `pgbouncer=true` · PgBouncer en mode TRANSACTION ne conserve pas
              les requêtes préparées d'une transaction à l'autre ; sans ce
              drapeau, Prisma les réutilise et la base répond « prepared
              statement already exists » à la DEUXIÈME requête · donc en
              production, jamais au premier essai.

              `connection_limit` · borne le pool de CHAQUE instance Cloud Run.
              Sans elle, Prisma prend son défaut (lié au nombre de cœurs) et
              le total dépend du hasard du dimensionnement.

              RIEN N'EST ÉCRASÉ : un paramètre déjà présent dans le secret est
              le choix de l'exploitant, et il prime. Rien n'est ajouté non
              plus à un endpoint direct, où ces deux réglages n'auraient pas
              de sens (le repli ci-dessus passe par là)."""
              parties = urlsplit(chaine)
              if "-pooler" not in (parties.hostname or ""):
                  return chaine
              parametres = dict(parse_qsl(parties.query, keep_blank_values=True))
              parametres.setdefault("pgbouncer", "true")
              parametres.setdefault("connection_limit", "10")
              return urlunsplit(parties._replace(query=urlencode(parametres)))

          variables["DATABASE_URL"] = regler_le_pooling(variables["DATABASE_URL"])

          # LE RÉGIME DE CONNEXION, DIT ICI · c'est ce fichier, et lui seul,
          # qui donne ses variables au service (`--env-vars-file` REMPLACE
          # tout). Ce qu'on écrit dedans est donc exactement ce que le serveur
          # recevra : l'affirmer ici ne demande aucun droit de lecture, à la
          # différence des journaux Cloud Run · le compte de service du
          # déploiement peut déployer, pas lire (PERMISSION_DENIED du
          # 2026-09-03). La ligne reprend mot pour mot celle que le serveur
          # écrit à son démarrage, et n'en dit pas plus : ni hôte, ni base, ni
          # utilisateur, ni mot de passe (src/common/pooling-base.ts).
          parties = urlsplit(variables["DATABASE_URL"])
          parametres = dict(parse_qsl(parties.query, keep_blank_values=True))
          plafond = parametres.get("connection_limit")
          regime = "POOLÉ" if "-pooler" in (parties.hostname or "") else "DIRECT (non poolé)"
          print(
              f"Base · endpoint {regime}, plafond de connexions "
              f"{plafond + ' par instance' if plafond else 'défaut Prisma'}",
              file=sys.stderr,
          )
          if regime.startswith("POOLÉ"):
              print("::notice::Le service recevra l'endpoint POOLÉ", file=sys.stderr)
          else:
              print(
                  "::warning::Le service recevra l'endpoint DIRECT · le secret "
                  "API_DATABASE_URL_POOLED est absent ou ne porte pas un hôte -pooler "
                  "(voir docs/connexions-et-plafonds.md)",
                  file=sys.stderr,
              )

          # Facultative · secret absent ou vide, la variable n'est pas posée
          # (le bootstrap n'accorde alors rien, et ne retire jamais rien).
          if os.environ.get("OPERATEURS_PLATEFORME"):
              variables["OPERATEURS_PLATEFORME"] = os.environ["OPERATEURS_PLATEFORME"]
          print(json.dumps(variables))
          PY
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --quiet \
            --min-instances 1 \
            --cpu-boost \
            --concurrency 80 \
            --max-instances 4 \
            --env-vars-file /tmp/env-vars.yaml

      # PREUVE DU RÉGIME DE CONNEXION · le déploiement le dit lui-même.
      #
      # Un déploiement vert ne prouve PAS que l'endpoint poolé est en service :
      # le repli sur la chaîne directe passe au vert exactement pareil. La
      # seule preuve est la ligne que le serveur écrit à son démarrage, et
      # elle vivait jusqu'ici dans les journaux Cloud Run · c'est-à-dire hors
      # d'atteinte de l'environnement de développement (politique réseau) et
      # à deux consoles de distance pour l'exploitant.
      #
      # Elle est donc relue ICI, où les deux la voient. Elle ne porte ni hôte,
      # ni base, ni utilisateur, ni mot de passe · c'est tout l'objet de
      # `src/common/pooling-base.ts`, et un test le verrouille.
      #
      # AVERTISSEMENT, JAMAIS ÉCHEC · l'ingestion des journaux prend un
      # instant, et le compte de service peut ne pas avoir le droit de les
      # lire. Faire tomber un déploiement réussi pour une ligne pas encore
      # indexée serait une panne fabriquée.
      # CONFIRMATION PAR LE SERVEUR LUI-MÊME · facultative, et c'est assumé.
      #
      # L'étape précédente dit ce que le service REÇOIT, ce qui suffit :
      # `--env-vars-file` remplace toutes ses variables, il n'y a pas d'autre
      # source. Cette étape-ci lit ce que le service DIT au démarrage, ce qui
      # est une confirmation de plus, pas la preuve principale.
      #
      # Elle ne marche que si le compte de service a `roles/logging.viewer`,
      # ce qui n'est pas le cas aujourd'hui (il peut déployer, pas lire). Une
      # SEULE tentative, donc, et un message qui dit quoi accorder à qui ·
      # faire attendre quarante-cinq secondes un contrôle qu'on sait refusé
      # apprend surtout à ignorer les avertissements.
      - name: Confirmation par le journal du service
        continue-on-error: true
        run: |
          filtre='resource.type="cloud_run_revision"'
          filtre="$filtre AND resource.labels.service_name=\"$SERVICE\""
          journal=$(gcloud logging read "$filtre" \
            --project "$PROJECT_ID" \
            --limit 300 \
            --freshness 30m \
            --format='value(textPayload,jsonPayload.message)' 2>/tmp/gcloud-logging.err) || true
          ligne=$(printf '%s\n' "$journal" | grep -m1 'Base ·' || true)
          if [ -n "$ligne" ]; then
            echo "le serveur confirme · $ligne"
            exit 0
          fi
          if grep -q 'PERMISSION_DENIED' /tmp/gcloud-logging.err 2>/dev/null; then
            echo "Journal non lisible par le compte de service du déploiement · confirmation sautée."
            echo "Pour l'activer : console Google Cloud > IAM > le compte github-deploy > accorder le rôle « Lecteur de journaux » (roles/logging.viewer)."
            exit 0
          fi
          cat /tmp/gcloud-logging.err 2>/dev/null || true
          echo "Ligne pas encore indexée · sans conséquence, le régime est déjà affirmé à l'envoi."

      # PREUVE DE VIE · un déploiement n'est fini que si le service répond ET
      # joint sa base. /health renvoie 503 sinon (voir sante.controller.ts) ·
      # le déploiement échoue alors en rouge au lieu de laisser croire que
      # tout va bien.
      - name: Contrôle de santé du service déployé
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sf "https://comptaflow-api-968832127045.us-east1.run.app/health"; then
              echo " · service vivant, base joignable"; exit 0
            fi
            echo "tentative $i · pas encore prêt, nouvelle tentative dans 10 s"
            sleep 10
          done
          echo "::error::Le service ne répond pas sainement après déploiement"
          exit 1
