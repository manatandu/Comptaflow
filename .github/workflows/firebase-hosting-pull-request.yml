name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    # PAS DE CANAL D'APERÇU POUR DEPENDABOT (relevé le 2026-09-28 par l'audit
    # de cohérence des corrections F195 et F266 de l'audit final). Une
    # demande de tirage ouverte par Dependabot ne reçoit pas les secrets
    # Actions du dépôt, seulement les siens · le compte de service Firebase
    # est vide, et ce job tombait à chaque montée (dix échecs sur les dix
    # derniers runs de Dependabot). Une montée se juge au portillon
    # `verifier` de deploy-cloud-run.yml et à tests-navigateur.yml, qui ne
    # lisent aucun secret ; un rouge qui ne dit rien de la montée apprendrait
    # seulement à ignorer les rouges. On lit l'AUTEUR de la demande de tirage,
    # pas l'acteur du run · c'est lui qui dit qu'elle vient de Dependabot,
    # quel que soit celui qui relance le run.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Le Node de la production, comme les autres workflows (audit final F194)
      # · sans cette étape, le job prenait celui de l'image du runner, et vite
      # 6 comme vitest 5 fixent chacun un plancher de version de Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm run build
        working-directory: client
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMEGA_X_EC07A }}
          projectId: omega-x-ec07a
          entryPoint: ./client
