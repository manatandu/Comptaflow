name: Sauvegarde de la base (éprouvée par restauration)

# UNE SAUVEGARDE JAMAIS RESTAURÉE N'EST PAS UNE SAUVEGARDE · chaque
# exécution exporte la base Neon, la RESTAURE dans un Postgres jetable et
# vérifie ce qui compte (tables présentes, dossiers présents, balance
# globale équilibrée) AVANT d'archiver le fichier. Un export corrompu ou
# vide fait échouer le workflow au lieu de dormir 90 jours en donnant une
# fausse assurance.
#
# Archivage : le fichier est CHIFFRÉ avant de quitter le job. Il partait
# auparavant en artefact GitHub en clair, conservé 90 jours · quiconque a
# l'accès en lecture aux Actions du dépôt téléchargeait la comptabilité
# complète de tous les cabinets. Le chiffrement est ASYMÉTRIQUE (age) : la
# CI ne détient que la clé publique du destinataire, jamais de quoi
# déchiffrer. Un dépôt compromis ne donne donc aucune donnée.
#
# La clé publique se pose en VARIABLE de dépôt CLE_AGE_SAUVEGARDES (une
# clé publique n'est pas un secret). Sans elle, le workflow ÉCHOUE au lieu
# d'archiver en clair · un échec bruyant vaut mieux qu'une fuite muette.
#
# Destinations : artefact GitHub (90 jours) et, si BUCKET_SAUVEGARDES est
# définie, copie durable vers Cloud Storage. Procédure de restauration et
# de génération de la clé : docs/sauvegardes-et-restauration.md.

on:
  schedule:
    # 02:00 UTC · 03:00 à Kinshasa, hors des heures de travail.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sauvegarder-et-eprouver:
    runs-on: ubuntu-latest
    services:
      # Le Postgres JETABLE de la restauration d'épreuve · détruit avec le
      # job, il ne sert qu'à prouver que le fichier se restaure.
      epreuve:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: epreuve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      # Le client pg_dump doit être AU MOINS de la version du serveur Neon
      # (PostgreSQL 18 · constaté lors de la première exécution d'épreuve, qui
      # a précisément servi à ça) · celui des dépôts Ubuntu retarde, on prend
      # le dépôt PostgreSQL officiel. Et on appelle les BINAIRES VERSIONNÉS :
      # le sélecteur /usr/bin/pg_dump d'Ubuntu a choisi le client 16
      # préinstallé sur l'image malgré l'installation du bon · c'est lui qui
      # a fait échouer la première épreuve.
      - name: Installer le client PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client-18
          echo "PGBIN=/usr/lib/postgresql/18/bin" >> "$GITHUB_ENV"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Exporter la base (pg_dump)
        env:
          # La chaîne DIRECTE (sans -pooler) · pg_dump tient une session
          # longue, incompatible avec le pooling en mode transaction.
          DATABASE_URL: ${{ secrets.API_DATABASE_URL }}
        run: |
          horodatage=$(date -u +%Y-%m-%d-%H%M)
          echo "HORODATAGE=$horodatage" >> "$GITHUB_ENV"
          "$PGBIN/pg_dump" "$DATABASE_URL" \
            --format=custom \
            --no-owner \
            --no-privileges \
            --file "sauvegarde-omegax-$horodatage.dump"
          ls -l "sauvegarde-omegax-$horodatage.dump"

      - name: "Restauration d'épreuve"
        env:
          PGPASSWORD: epreuve
        run: |
          "$PGBIN/createdb" -h localhost -U postgres epreuve
          "$PGBIN/pg_restore" -h localhost -U postgres --dbname epreuve \
            --no-owner --no-privileges \
            "sauvegarde-omegax-$HORODATAGE.dump"

      - name: "Vérifications sur la base restaurée"
        env:
          PGPASSWORD: epreuve
        run: |
          interroger() { "$PGBIN/psql" -h localhost -U postgres -d epreuve -tAc "$1"; }

          tables=$(interroger "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          dossiers=$(interroger "SELECT count(*) FROM tenants")
          utilisateurs=$(interroger "SELECT count(*) FROM users")
          lignes=$(interroger "SELECT count(*) FROM lignes_ecriture")
          # L'invariant comptable le plus fondamental doit survivre à
          # l'aller-retour · une base restaurée déséquilibrée serait pire
          # qu'inutile.
          desequilibre=$(interroger "SELECT COALESCE(abs(sum(debit) - sum(credit)), 0) > 0.01 FROM lignes_ecriture")

          echo "Tables : $tables · Dossiers : $dossiers · Utilisateurs : $utilisateurs · Lignes d'écriture : $lignes"

          if [ "$tables" -lt 20 ]; then
            echo "::error::Restauration suspecte · $tables tables seulement (au moins 20 attendues)"; exit 1
          fi
          if [ "$dossiers" -lt 1 ] || [ "$utilisateurs" -lt 1 ]; then
            echo "::error::Restauration suspecte · aucune donnée (dossiers=$dossiers, utilisateurs=$utilisateurs)"; exit 1
          fi
          if [ "$desequilibre" = "t" ]; then
            echo "::error::La balance globale de la base restaurée est déséquilibrée"; exit 1
          fi
          echo "Sauvegarde ÉPROUVÉE · elle se restaure, et la comptabilité restaurée boucle."

      # LE CHIFFREMENT N'EST PAS FACULTATIF · sans clé publique configurée,
      # le job s'arrête ici. Il ne retombe JAMAIS sur un archivage en clair :
      # c'est exactement le comportement qui a fait dormir quatre-vingt-dix
      # jours de comptabilité en clair dans les artefacts du dépôt.
      - name: "Exiger la clé publique de chiffrement"
        env:
          CLE_AGE: ${{ vars.CLE_AGE_SAUVEGARDES }}
        run: |
          if [ -z "$CLE_AGE" ]; then
            echo "::error::Variable de dépôt CLE_AGE_SAUVEGARDES absente · la sauvegarde ne sera PAS archivée en clair. Générer la clé et poser la variable : voir docs/sauvegardes-et-restauration.md"
            exit 1
          fi
          case "$CLE_AGE" in
            age1*) ;;
            *) echo "::error::CLE_AGE_SAUVEGARDES ne ressemble pas à une clé publique age (attendu : age1...)"; exit 1 ;;
          esac
          sudo apt-get install -y age
          age --version

      # Deux destinataires · la clé de l'exploitant, et une clé ÉPHÉMÈRE
      # générée ici même. La seconde ne sert qu'à prouver, dans la foulée,
      # que le fichier chiffré se déchiffre et rend l'original octet pour
      # octet ; elle meurt avec le job. Sans elle, on archiverait un
      # chiffré que personne n'a jamais ouvert · la même faute que la
      # sauvegarde jamais restaurée, d'un cran plus haut.
      - name: "Chiffrer, puis éprouver le chiffré"
        env:
          CLE_AGE: ${{ vars.CLE_AGE_SAUVEGARDES }}
        run: |
          clair="sauvegarde-omegax-$HORODATAGE.dump"
          chiffre="$clair.age"

          age-keygen -o /tmp/epreuve.key 2>/dev/null
          publique_epreuve=$(grep -oE 'age1[0-9a-z]+' /tmp/epreuve.key | head -1)

          age --encrypt --recipient "$CLE_AGE" --recipient "$publique_epreuve" \
            --output "$chiffre" "$clair"

          # Le fichier doit VRAIMENT être chiffré · l'en-tête age le dit.
          if ! head -c 21 "$chiffre" | grep -q 'age-encryption.org'; then
            echo "::error::Le fichier archivé ne porte pas l'en-tête age · refus d'archiver"; exit 1
          fi

          # Aller-retour complet : déchiffré avec l'identité éphémère, il
          # doit rendre exactement l'original.
          age --decrypt --identity /tmp/epreuve.key --output /tmp/verifie.dump "$chiffre"
          empreinte_clair=$(sha256sum "$clair" | cut -d' ' -f1)
          empreinte_tour=$(sha256sum /tmp/verifie.dump | cut -d' ' -f1)
          if [ "$empreinte_clair" != "$empreinte_tour" ]; then
            echo "::error::Le chiffré ne rend pas l'original · refus d'archiver"; exit 1
          fi

          shred -u /tmp/verifie.dump /tmp/epreuve.key "$clair"
          echo "Chiffré ÉPROUVÉ · $(ls -l "$chiffre" | awk '{print $5}') octets, déchiffrable, identique à l'original."

      # Garde-fou d'archivage · si un .dump en clair traîne encore dans le
      # répertoire de travail, le motif d'archivage ci-dessous pourrait le
      # ramasser. On le vérifie au lieu de l'espérer.
      - name: "Vérifier qu'aucun fichier en clair ne subsiste"
        run: |
          restants=$(find . -maxdepth 1 -name '*.dump' -not -name '*.age' | wc -l)
          if [ "$restants" -ne 0 ]; then
            echo "::error::Un export en clair subsiste dans le répertoire de travail · refus d'archiver"
            find . -maxdepth 1 -name '*.dump' -not -name '*.age'
            exit 1
          fi

      # 90 jours en artefact. Le motif ne prend QUE le chiffré · le clair
      # n'existe plus à ce stade, et l'étape précédente le prouve.
      - name: Archiver (artefact GitHub chiffré, 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-omegax-${{ env.HORODATAGE }}
          path: sauvegarde-omegax-*.dump.age
          retention-days: 90
          if-no-files-found: error

      - name: S'authentifier sur Google Cloud (si bucket configuré)
        if: ${{ vars.BUCKET_SAUVEGARDES != '' }}
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Copier vers Cloud Storage (si bucket configuré)
        if: ${{ vars.BUCKET_SAUVEGARDES != '' }}
        run: |
          gcloud storage cp "sauvegarde-omegax-$HORODATAGE.dump.age" "gs://${{ vars.BUCKET_SAUVEGARDES }}/"
